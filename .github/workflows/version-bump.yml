name: Auto Version Bump en Main

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    # Evitar loops si el commit proviene del propio bump
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Bump de Versión
        id: bump
        run: |
          node scripts/bump-version.mjs patch

      - name: Commit y Push de la nueva versión a main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/constants/platform.ts
          # Solo commitear si hay cambios reales
          if git diff --staged --quiet; then
            echo "No se detectaron cambios pendientes de versión."
          else
            NEW_VER=$(node -p "require('./package.json').version")
            git commit -m "chore(release): bump version to v${NEW_VER} [skip ci]"
            git push origin main
          fi

